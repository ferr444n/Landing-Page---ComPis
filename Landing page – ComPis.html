ound: #FFE14D; border: 3px solid #111111; box-shadow: 3px 3px 0 #111111; display: flex; align-items: center; justify-content: center; box-sizing: border-box;\">\n          <svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#111111\" stroke-width=\"2.5\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M3 11l9-7 9 7\"><\u002Fpath><path d=\"M5 10v10h14V10\"><\u002Fpath><path d=\"M10 20v-6h4v6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em;\">Com<span style=\"background: #FF8FB1; padding: 0 4px; border: 2px solid #111111;\">Pis<\u002Fspan><\u002Fspan>\n      <\u002Fa>\n      <nav aria-label=\"Navegació principal\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 22px; font-weight: 500; font-size: 15px;\">\n        <a href=\"#finances\" style=\"text-decoration: none;\">Finances<\u002Fa>\n        <a href=\"#tasques\" style=\"text-decoration: none;\">Tasques<\u002Fa>\n        <a href=\"#compra\" style=\"text-decoration: none;\">Compra<\u002Fa>\n        <a href=\"#convivencia\" style=\"text-decoration: none;\">Convivència<\u002Fa>\n        <a href=\"#comenca\" style=\"text-decoration: none; background: #111111; color: #FFFDF5; padding: 12px 18px; border: 3px solid #111111; box-shadow: 3px 3px 0 #FF8FB1; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; font-weight: 700;\">Entra al pis →<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section id=\"inici\" style=\"background: #FFE14D; border-bottom: 3px solid #111111;\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 72px 24px 88px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px;\">\n      <div style=\"flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 26px;\">\n        <span style=\"align-self: flex-start; font-family: 'DM Mono', monospace; font-size: 13px; background: #FFFDF5; border: 2px solid #111111; padding: 6px 10px;\">// app per a pisos compartits<\u002Fspan>\n        <h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 4.4rem; line-height: 0.95; letter-spacing: -0.035em;\">El pis és de tots.<br>L'organització, també.<\u002Fh1>\n        <p style=\"margin: 0; font-size: 1.2rem; line-height: 1.5; max-width: 540px;\">ComPis reparteix les despeses, fa rotar els torns de neteja, sincronitza la compra i ajuda a prendre decisions sense discussions al grup de WhatsApp. Tot en una sola app per a tot el pis.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 14px; padding-top: 6px;\">\n          <a href=\"#comenca\" style=\"background: #111111; color: #FFFDF5; text-decoration: none; font-weight: 700; font-size: 17px; padding: 16px 24px; border: 3px solid #111111; box-shadow: 5px 5px 0 #FF8FB1; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center;\">Crea el teu pis<\u002Fa>\n          <a href=\"#finances\" style=\"background: #FFFDF5; color: #111111; text-decoration: none; font-weight: 700; font-size: 17px; padding: 16px 24px; border: 3px solid #111111; box-shadow: 5px 5px 0 #111111; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center;\">Descobreix les funcions<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Hero mock -->\n      <div style=\"flex: 1 1 400px; min-width: 0; display: flex; justify-content: center;\">\n        <div role=\"img\" aria-label=\"Exemple de ComPis: resum del pis amb saldo, torn de neteja, inventari i una votació oberta\" style=\"width: 100%; max-width: 430px; background: #FFFDF5; border: 3px solid #111111; box-shadow: 10px 10px 0 #111111; box-sizing: border-box;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bott : 8px 8px 0 #111111;\">\n          <div style=\"padding: 12px 18px; border-bottom: 3px solid #111111; background: #111111; color: #FFFDF5; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px;\">Aquest cap de setmana<\u002Fdiv>\n          <div style=\"padding: 4px 18px; display: flex; flex-direction: column; font-size: 15px;\">\n            <div style=\"display: flex; gap: 14px; padding: 10px 0; border-bottom: 2px dashed #111111;\"><span style=\"font-family: 'DM Mono', monospace; flex: 0 0 34px;\">dv<\u002Fspan><span>La parella del Pol es queda a dormir<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 14px; padding: 10px 0; border-bottom: 2px dashed #111111;\"><span style=\"font-family: 'DM Mono', monospace; flex: 0 0 34px;\">ds<\u002Fspan><span>La Laia porta 3 convidats a sopar<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 14px; padding: 10px 0;\"><span style=\"font-family: 'DM Mono', monospace; flex: 0 0 34px;\">dg<\u002Fspan><span>La Marta és fora tot el cap de setmana<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 22px;\">\n        <span style=\"align-self: flex-start; font-family: 'DM Mono', monospace; font-size: 13px; background: #FFFDF5; border: 2px solid #111111; padding: 4px 10px;\">04 · convivència i comunicació<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 3rem; line-height: 1; letter-spacing: -0.03em;\">Decidiu junts. Sense drames.<\u002Fh2>\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <div style=\"display: flex; gap: 14px;\">\n            <span style=\"font-family: 'DM Mono', monospace; font-size: 14px; flex-shrink: 0; padding-top: 3px;\">→<\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\"><h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 1.25rem;\">Votacions i enquestes<\u002Fh3><p style=\"margin: 0; font-size: 15px; line-height: 1.5;\">Preneu decisions sense discussions al grup de WhatsApp: una fregidora d'aire a mitges, una festa dissabte o canviar d'internet.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\">\n            <span style=\"font-family: 'DM Mono', monospace; font-size: 14px; flex-shrink: 0; padding-top: 3px;\">→<\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\"><h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 1.25rem;\">Calendari de visites<\u002Fh3><p style=\"margin: 0; font-size: 15px; line-height: 1.5;\">Marca quan portes convidats, quan es queda a dormir la parella o si marxes el cap de setmana, i tothom sap amb qui compta per sopar.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PLANTILLES -->\n  <section id=\"plantilles\" style=\"background: #111111; color: #FFFDF5; border-bottom: 3px solid #111111;\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 44px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 700px;\">\n        <span style=\"font-family: 'DM Mono', monospace; font-size: 14px; color: #FFE14D;\">// plantilles<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 3rem; line-height: 1; letter-spacing: -0.03em;\">No comencis de zero.<\u002Fh2>\n        <p style=\"margin: 0; font-size: 1.15rem; line-height: 1.5; color: #E7E5E4;\">Cada llista es pot crear a partir d'una plantilla: tria-la, ajusta-la al teu pis i assigna-la als companys. També pots desar les vostres pròpies plantilles.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;\">\n        <div style=\"background: #FFFDF5; color: #111111; border: 3px solid #FFFDF5; padding: 22px; display: flex; flex-direction: column; gap: 12px;\">\n          <span style=\"align-self: flex-start; font-family: 'DM Mono', monospace; font-size: 12px; background: #FF8FB1; border: 2px solid #111111; padding: 3px 8px;\">finances<\u002Fspan>\n          <h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 1.3rem;\">Despeses fixes del mes<\u002Fh3>\n          <p style=\"margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; line-height: 1.7;\">Lloguer<br>Llum · Aigua · Gas<br>Internet<br>Productes de neteja<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFDF5; color: #111111; border: 3px solid #FFFDF5; padding: 22px; display: flex; flex-direction: column; gap: 12px;\">\n          <span style=\"align-self: flex-start; font-family: 'DM Mono', monospace; font-size: 12px; background: #7FB2FF; border: 2px solid #111111; padding: 3px 8px;\">tasques<\u002Fspan>\n          <h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 1.3rem;\">Zones de neteja rotatives<\u002Fh3>\n          <p style=\"margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; line-height: 1.7;\">Cuina<br>Banys<br>Menjador<br>Escombraries i reciclatge<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFDF5; color: #111111; border: 3px solid #FFFDF5; padding: 22px; display: flex; flex-direction: column; gap: 12px;\">\n          <span style=\"align-self: flex-start; font-family: 'DM Mono', monospace; font-size: 12px; background: #8BE28B; border: 2px solid #111111; padding: 3px 8px;\">compra<\u002Fspan>\n          <h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 1.3rem;\">Inventari de bàsics<\u002Fh3>\n          <p style=\"margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; line-height: 1.7;\">Paper de vàter<br>Oli · Sal<br>Sabó de plats<br>Bosses d'escombraries<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #FFFDF5; color: #111111; border: 3px solid #FFFDF5; padding: 22px; display: flex; flex-direction: column; gap: 12px;\">\n          <span style=\"align-self: flex-start; font-family: 'DM Mono', monospace; font-size: 12px; background: #FFE14D; border: 2px solid #111111; padding: 3px 8px;\">convivència<\u002Fspan>\n          <h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 1.3rem;\">Normes bàsiques<\u002Fh3>\n          <p style=\"margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; line-height: 1.7;\">Silenci a partir de les 23 h<br>Avisar abans de portar visites<br>Plats nets el mateix dia<br>Respectar el menjar de cadascú<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FULL DE RUTA -->\n  <section id=\"ruta\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 44px;\">\n    <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 3rem; line-height: 1; letter-spacing: -0.03em;\">Full de ruta<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px;\">\n      <div style=\"border: 3px solid #111111; box-shadow: 8px 8px 0 #111111; background: #8BE28B; padding: 26px; display: flex; flex-direction: column; gap: 14px;\">\n        <span style=\"font-family: 'DM Mono', monospace; font-size: 13px;\">fase 1 · MVP<\u002Fspan>\n        <h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 1.6rem;\">El nucli<\u002Fh3>\n        <ul style=\"margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.8;\">\n          <li>Usuaris i inici de ses        <input id=\"email\" type=\"email\" placeholder=\"nom@correu.cat\" style=\"flex: 1 1 220px; min-width: 0; min-height: 54px; box-sizing: border-box; padding: 0 16px; border: 3px solid #111111; background: #FFFDF5; font-family: 'DM Sans', sans-serif; font-size: 16px; color: #111111;\">\n        <button type=\"button\" style=\"min-height: 54px; padding: 0 24px; border: 3px solid #111111; background: #111111; color: #FFFDF5; box-shadow: 5px 5px 0 #FFFDF5; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer;\">Comença →<\u002Fbutton>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background: #FFFDF5;\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-family: 'DM Mono', monospace; font-size: 13px;\">\n      <span><strong style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px;\">ComPis<\u002Fstrong> · Projecte de [NOM DE L'ASSIGNATURA] · [UNIVERSITAT]<\u002Fspan>\n      <span>Equip: [NOMS DE L'EQUIP] · 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:6200}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
